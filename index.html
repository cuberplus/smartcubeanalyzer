<head>
  <meta charset="utf-8" />

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self' data:; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />

  <link rel="manifest" href="%BASE_URL%manifest.json" vite-ignore />
  <!--
      react-data-grid's stylesheet is served verbatim from public/ rather than
      imported, because the production CSS minifier merges its @layer blocks and
      silently drops declarations - which collapsed every sortable grid header to
      a single character. public/ is copied as-is, so the file reaches the browser
      exactly as the package shipped it. RdgStylesheet.test.ts keeps the copy in
      sync with node_modules.
    -->
  <link rel="stylesheet" href="%BASE_URL%react-data-grid.css" vite-ignore />
  <title>Smartcube Analyzer</title>
</head>
